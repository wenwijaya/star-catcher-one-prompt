<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Star Catcher — one prompt, one game</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0b1030; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #wrap { position: relative; width: min(100vw, 56.25vh); height: min(100vh, 177.78vw); }
  canvas { display: block; width: 100%; height: 100%; border-radius: 12px; box-shadow: 0 0 60px rgba(120, 80, 255, .35); }
  #hint { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; color: #cfd6ff; font-size: 12px; opacity: .75; pointer-events: none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="540" height="960"></canvas>
  <div id="hint">move: mouse / touch / &larr; &rarr; &nbsp;·&nbsp; catch stars, dodge bombs</div>
</div>
<script>
"use strict";
// Star Catcher — a tiny browser game built from ONE prompt:
// "Build a tiny browser game in one HTML file: a basket catches falling
//  stars — move with arrow keys or mouse, 60 seconds, score points,
//  it gets faster. No libraries."
const cv = document.getElementById("game");
const ctx = cv.getContext("2d");
const W = 540, H = 960;

const state = {
  mode: "start",      // start | play | over
  score: 0,
  lives: 3,
  timeLeft: 60,
  elapsed: 0,
  basketX: W / 2,
  basketTarget: W / 2,
  items: [],
  spawnT: 0,
  particles: [],
  combo: 0,
  bestCombo: 0,
  flash: 0,
  twinkles: [],
};
for (let i = 0; i < 70; i++) {
  state.twinkles.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.8 + 0.4, p: Math.random() * Math.PI * 2, s: 0.5 + Math.random() * 1.5 });
}

// Exposed for the auto-player that records the demo footage.
window.__game = state;

function reset() {
  state.score = 0; state.lives = 3; state.timeLeft = 60; state.elapsed = 0;
  state.items = []; state.particles = []; state.combo = 0; state.bestCombo = 0;
  state.spawnT = 0; state.flash = 0; state.mode = "play";
}

function spawnItem() {
  const r = Math.random();
  const speed = 170 + state.elapsed * 4 + Math.random() * 90;
  if (r < 0.10) {
    state.items.push({ kind: "bomb", x: 30 + Math.random() * (W - 60), y: -30, vy: speed * 0.9, r: 20, rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 4 });
  } else if (r < 0.24) {
    state.items.push({ kind: "gold", x: 30 + Math.random() * (W - 60), y: -30, vy: speed * 0.85, r: 16, rot: 0, vr: 1.2 });
  } else {
    state.items.push({ kind: "star", x: 30 + Math.random() * (W - 60), y: -30, vy: speed, r: 15, rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 3 });
  }
}

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 180;
    state.particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40, life: 0.6 + Math.random() * 0.4, color, r: 2 + Math.random() * 3 });
  }
}

function drawStar(x, y, r, rot, color) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const rr = i % 2 === 0 ? r : r * 0.45;
    const a = (i / 10) * Math.PI * 2 - Math.PI / 2;
    ctx[i === 0 ? "moveTo" : "lineTo"](Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath();
  ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 18; ctx.fill();
  ctx.restore();
}

function drawBasket() {
  const bx = state.basketX, by = H - 90;
  ctx.save();
  ctx.translate(bx, by);
  // glow
  ctx.shadowColor = "#ffb347"; ctx.shadowBlur = 24;
  // basket body: trapezoid
  ctx.beginPath();
  ctx.moveTo(-58, -16); ctx.lineTo(58, -16); ctx.lineTo(44, 26); ctx.lineTo(-44, 26); ctx.closePath();
  const g = ctx.createLinearGradient(0, -16, 0, 26);
  g.addColorStop(0, "#ffb347"); g.addColorStop(1, "#ff7b2f");
  ctx.fillStyle = g; ctx.fill();
  ctx.shadowBlur = 0;
  // weave lines
  ctx.strokeStyle = "rgba(120,40,0,.45)"; ctx.lineWidth = 3;
  for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(i * 28 - 6, -14); ctx.lineTo(i * 28 - 4, 24); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(-52, 4); ctx.lineTo(52, 4); ctx.stroke();
  // rim
  ctx.beginPath(); ctx.moveTo(-62, -16); ctx.lineTo(62, -16);
  ctx.strokeStyle = "#ffd9a0"; ctx.lineWidth = 7; ctx.lineCap = "round"; ctx.stroke();
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function drawHUD() {
  ctx.save();
  ctx.textBaseline = "top";
  // score
  ctx.font = "800 44px system-ui, sans-serif";
  ctx.fillStyle = "#ffffff";
  ctx.shadowColor = "rgba(0,0,0,.5)"; ctx.shadowBlur = 8;
  ctx.fillText("★ " + state.score, 22, 18);
  // timer bar
  const tw = W - 44, frac = Math.max(0, state.timeLeft / 60);
  roundRect(22, 76, tw, 14, 7);
  ctx.fillStyle = "rgba(255,255,255,.18)"; ctx.fill();
  roundRect(22, 76, tw * frac, 14, 7);
  ctx.fillStyle = frac > 0.33 ? "#7CFC9A" : "#ff5d5d"; ctx.fill();
  ctx.font = "700 22px system-ui, sans-serif";
  ctx.fillStyle = "#ffffff";
  ctx.fillText(Math.ceil(state.timeLeft) + "s", 22, 98);
  // lives
  ctx.font = "34px system-ui, sans-serif";
  ctx.textAlign = "right";
  ctx.fillText("♥".repeat(state.lives) + "♡".repeat(Math.max(0, 3 - state.lives)), W - 22, 16);
  ctx.textAlign = "left";
  if (state.combo >= 3) {
    // centered under the timer bar, clear of the make.fun badge zone (top-left)
    ctx.font = "800 26px system-ui, sans-serif";
    ctx.fillStyle = "#ffd94d";
    ctx.textAlign = "center";
    ctx.fillText("COMBO x" + state.combo, W / 2, 205);
    ctx.textAlign = "left";
  }
  ctx.restore();
}

function drawCenter(title, sub, cta) {
  ctx.save();
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = 16;
  ctx.fillStyle = "#ffffff";
  ctx.font = "900 64px system-ui, sans-serif";
  ctx.fillText(title, W / 2, H / 2 - 130);
  ctx.font = "500 26px system-ui, sans-serif";
  ctx.fillStyle = "#dfe6ff";
  const lines = sub.split("\n");
  lines.forEach((ln, i) => ctx.fillText(ln, W / 2, H / 2 - 40 + i * 36));
  if (cta) {
    roundRect(W / 2 - 170, H / 2 + 60, 340, 72, 36);
    ctx.fillStyle = "#ff2e88"; ctx.shadowBlur = 0; ctx.fill();
    ctx.fillStyle = "#ffffff"; ctx.font = "800 30px system-ui, sans-serif";
    ctx.fillText(cta, W / 2, H / 2 + 97);
  }
  ctx.restore();
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

function update(dt) {
  // twinkle always
  for (const t of state.twinkles) t.p += dt * t.s;
  // basket easing toward target
  state.basketX += (state.basketTarget - state.basketX) * Math.min(1, dt * 14);
  state.basketX = Math.max(60, Math.min(W - 60, state.basketX));
  if (state.flash > 0) state.flash -= dt;
  for (const p of state.particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt; p.life -= dt; }
  state.particles = state.particles.filter((p) => p.life > 0);
  if (state.mode !== "play") return;

  state.elapsed += dt;
  state.timeLeft -= dt;
  if (state.timeLeft <= 0) { state.timeLeft = 0; state.mode = "over"; return; }

  state.spawnT -= dt;
  if (state.spawnT <= 0) {
    spawnItem();
    state.spawnT = Math.max(0.28, 0.85 - state.elapsed * 0.008);
  }
  const basketY = H - 90;
  for (const it of state.items) {
    it.y += it.vy * dt;
    it.rot += it.vr * dt;
  }
  const kept = [];
  for (const it of state.items) {
    const caught = Math.abs(it.x - state.basketX) < 62 && Math.abs(it.y - basketY) < 34;
    if (caught) {
      if (it.kind === "bomb") {
        state.lives -= 1; state.combo = 0; state.flash = 0.35;
        burst(it.x, it.y, "#ff4444", 22);
        if (state.lives <= 0) { state.mode = "over"; }
      } else if (it.kind === "gold") {
        state.score += 25; state.combo += 1;
        burst(it.x, it.y, "#ffd94d", 18);
      } else {
        state.score += 10; state.combo += 1;
        burst(it.x, it.y, "#ffe27a", 12);
      }
      state.bestCombo = Math.max(state.bestCombo, state.combo);
      continue;
    }
    if (it.y > H + 40) {
      if (it.kind !== "bomb") { state.combo = 0; }
      continue;
    }
    kept.push(it);
  }
  state.items = kept;
}

function render() {
  // night sky
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#0b1030"); sky.addColorStop(0.55, "#1b2350"); sky.addColorStop(1, "#3b1d5e");
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  // twinkling background stars
  for (const t of state.twinkles) {
    ctx.globalAlpha = 0.35 + 0.65 * Math.abs(Math.sin(t.p));
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // moon
  ctx.save();
  ctx.fillStyle = "#fff7d6"; ctx.shadowColor = "#fff7d6"; ctx.shadowBlur = 40;
  ctx.beginPath(); ctx.arc(W - 78, 150, 34, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // ground
  ctx.fillStyle = "#141a3d"; ctx.fillRect(0, H - 46, W, 46);
  ctx.fillStyle = "#232c5c"; ctx.fillRect(0, H - 46, W, 4);

  if (state.mode !== "start") {
    for (const it of state.items) {
      if (it.kind === "bomb") {
        ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(it.rot);
        ctx.fillStyle = "#22242e"; ctx.shadowColor = "#000"; ctx.shadowBlur = 10;
        ctx.beginPath(); ctx.arc(0, 0, it.r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "#ff5d5d"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(-8, -8); ctx.lineTo(8, 8); ctx.moveTo(8, -8); ctx.lineTo(-8, 8); ctx.stroke();
        ctx.restore();
      } else if (it.kind === "gold") {
        drawStar(it.x, it.y, it.r + 4, it.rot, "#ffd94d");
      } else {
        drawStar(it.x, it.y, it.r, it.rot, "#ffe27a");
      }
    }
    for (const p of state.particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    drawBasket();
    drawHUD();
  }
  if (state.flash > 0) {
    ctx.fillStyle = "rgba(255,60,60," + (state.flash * 0.7).toFixed(3) + ")";
    ctx.fillRect(0, 0, W, H);
  }
  if (state.mode === "start") {
    drawCenter("STAR CATCHER", "One prompt. One game.\nCatch the falling stars — dodge the bombs.\n60 seconds. How many can you catch?", "▶  TAP TO PLAY");
  } else if (state.mode === "over") {
    const msg = state.lives <= 0 ? "OUT OF LIVES!" : "TIME'S UP!";
    drawCenter(msg, "Score: " + state.score + "\nBest combo: x" + state.bestCombo + "\n\nBuilt from ONE prompt by an AI agent.", "↻  PLAY AGAIN");
  }
}

function pointerToX(clientX) {
  const r = cv.getBoundingClientRect();
  return ((clientX - r.left) / r.width) * W;
}
cv.addEventListener("pointermove", (e) => { state.basketTarget = pointerToX(e.clientX); });
cv.addEventListener("pointerdown", (e) => {
  state.basketTarget = pointerToX(e.clientX);
  if (state.mode !== "play") reset();
});
window.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") state.basketTarget -= 46;
  if (e.key === "ArrowRight") state.basketTarget += 46;
  if ((e.key === " " || e.key === "Enter") && state.mode !== "play") reset();
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") e.preventDefault();
});

requestAnimationFrame(frame);
</script>
</body>
</html>
